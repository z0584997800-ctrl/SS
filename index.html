<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>צור קשר</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F2;
      --surface: #FFFFFF;
      --ink: #1A1A1A;
      --ink-muted: #5A5A5A;
      --accent: #2B5F8E;
      --accent-light: #E8F0F7;
      --border: #DCDCD8;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Heebo', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      padding-top: calc(40px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    .logo-circle {
      width: 56px;
      height: 56px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .logo-circle svg {
      width: 26px;
      height: 26px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--ink-muted);
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .contact-row:last-child {
      border-bottom: none;
    }

    .icon-wrap {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: var(--accent-light);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-label {
      font-size: 0.78rem;
      color: var(--ink-muted);
      font-weight: 400;
      margin-bottom: 2px;
    }

    .contact-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      direction: ltr;
      display: inline-block;
    }

    .contact-value:hover {
      color: var(--accent);
    }

    .call-btn {
      margin-top: 32px;
      display: block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Heebo', sans-serif;
      padding: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .call-btn:hover { background: #1f4a6e; }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="logo-circle">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
  </div>

  <h1>צור קשר</h1>
  <p class="subtitle">שמחים לשמוע ממך — נחזור אליך בהקדם.</p>

  <div class="contact-row">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>
    <div class="contact-info">
      <span class="contact-label">טלפון</span>
      <a class="contact-value" href="tel:0583283388">058-328-3388</a>
    </div>
  </div>

  <a class="call-btn" href="tel:0583283388">📞 התקשר עכשיו</a>

</div>

</body>
</html>
